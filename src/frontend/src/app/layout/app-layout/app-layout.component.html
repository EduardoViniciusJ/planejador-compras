<div class="app-layout" [class.sidebar-collapsed-layout]="isSidebarCollapsed()">
  <app-sidebar
    [class.sidebar-host-collapsed]="isSidebarCollapsed()"
    [class.sidebar-host-mobile-open]="isSidebarOpen()"
    [collapsed]="isSidebarCollapsed() || (isMobileViewport() && !isSidebarOpen())"
    [currentTheme]="currentTheme()"
    [currentUser]="currentUser()"
    [isLoggingOut]="isLoggingOut()"
    [isProfileMenuOpen]="isProfileMenuOpen()"
    [logoutErrorMessage]="logoutErrorMessage()"
    (navigationRequested)="closeMobileSidebar()"
    (collapseRequested)="toggleNavigation()"
    (themeRequested)="toggleTheme()"
    (profileRequested)="toggleProfileMenu()"
    (profileDismissRequested)="closeProfileMenu()"
    (logoutRequested)="logout()"
  />

  @if (isSidebarOpen()) {
    <button
      type="button"
      class="app-layout-sidebar-backdrop"
      aria-label="Fechar menu de navegacao"
      (click)="closeMobileSidebar()"
    ></button>
  }

  <div class="app-layout-content">
    <main class="app-layout-main">
      <router-outlet />
    </main>
  </div>
</div>
