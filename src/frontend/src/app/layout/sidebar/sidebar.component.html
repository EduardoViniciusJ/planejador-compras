<aside id="app-sidebar" class="sidebar" [class.sidebar-collapsed]="collapsed()" aria-label="Navegacao principal">
  <div class="sidebar-brand-row">
    <a class="sidebar-brand" routerLink="/app" aria-label="Planejador de Compras" (click)="notifyNavigation()">
      <img class="sidebar-brand-mark" src="/icons/brand-mark.svg" alt="" width="32" height="32" aria-hidden="true" />
    </a>
  </div>

  <nav class="sidebar-navigation" aria-label="Menu principal">
    @for (item of navigationItems; track item.route) {
      <a
        class="sidebar-nav-link"
        [routerLink]="item.route"
        routerLinkActive="sidebar-nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.title]="collapsed() ? item.label : null"
        (click)="notifyNavigation()"
      >
        <i class="bi" [class]="'bi ' + item.icon" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
