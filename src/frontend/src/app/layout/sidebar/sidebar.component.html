<aside
  id="app-sidebar"
  class="sidebar"
  [class.sidebar-collapsed]="collapsed()"
  aria-label="Navegacao principal"
>
  <div class="sidebar-brand-row">
    <a
      class="sidebar-brand"
      routerLink="/app"
      aria-label="Planejador de Compras"
      (click)="notifyNavigation()"
    >
      <img
        class="sidebar-brand-mark"
        src="/icons/brand-mascot.png"
        alt=""
        width="32"
        height="32"
        aria-hidden="true"
      />
    </a>
    <button
      type="button"
      class="sidebar-collapse-button"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="collapsed() ? 'Expandir menu lateral' : 'Recolher menu lateral'"
      [attr.title]="collapsed() ? 'Expandir menu lateral' : 'Recolher menu lateral'"
      (click)="collapseRequested.emit()"
    >
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
  </div>

  <nav class="sidebar-navigation" aria-label="Menu principal">
    @for (item of navigationItems; track item.route) {
      <a
        class="sidebar-nav-link"
        [routerLink]="item.route"
        routerLinkActive="sidebar-nav-link-active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [attr.title]="collapsed() ? item.label : null"
        (click)="notifyNavigation()"
      >
        <i class="bi" [class]="'bi ' + item.icon" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button
      type="button"
      class="sidebar-utility-button"
      [attr.aria-label]="themeButtonLabel()"
      [attr.aria-pressed]="currentTheme() === 'dark'"
      [attr.title]="collapsed() ? themeButtonLabel() : null"
      (click)="themeRequested.emit()"
    >
      <i
        class="bi"
        [class.bi-moon-stars-fill]="currentTheme() === 'light'"
        [class.bi-brightness-high-fill]="currentTheme() === 'dark'"
        aria-hidden="true"
      ></i>
      <span>{{ themeButtonLabel() }}</span>
    </button>

    <div class="sidebar-profile-menu">
      <button
        type="button"
        class="sidebar-utility-button sidebar-profile-button"
        aria-controls="profile-menu"
        [attr.aria-expanded]="isProfileMenuOpen()"
        aria-label="Abrir menu do perfil"
        [attr.title]="collapsed() ? 'Perfil' : null"
        (click)="profileRequested.emit()"
      >
        <i class="bi bi-person-circle" aria-hidden="true"></i>
        <span>{{ profileLabel() }}</span>
      </button>

      @if (isProfileMenuOpen()) {
        <section id="profile-menu" class="profile-menu-panel" aria-label="Menu do perfil">
          @if (currentUser(); as user) {
            <div class="profile-menu-user">
              <strong>{{ user.name || user.email }}</strong>
              <span>{{ user.email }}</span>
            </div>
          } @else {
            <div class="profile-menu-user">
              <strong>Conta</strong>
            </div>
          }

          @if (logoutErrorMessage()) {
            <p class="profile-menu-error" role="alert">{{ logoutErrorMessage() }}</p>
          }

          <button
            type="button"
            class="profile-menu-logout"
            [disabled]="isLoggingOut()"
            (click)="logoutRequested.emit()"
          >
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            {{ isLoggingOut() ? 'Saindo...' : 'Sair' }}
          </button>
        </section>
      }
    </div>
  </div>
</aside>
