<form nz-form nzLayout="vertical" class="feature-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-field">
    <span id="item-quote-supplier-label" class="form-label">Fornecedor</span>
    <nz-select
      formControlName="supplierId"
      nzPlaceHolder="Selecione um fornecedor"
      aria-labelledby="item-quote-supplier-label"
    >
      @for (supplier of suppliers(); track supplier.id) {
        <nz-option [nzValue]="supplier.id" [nzLabel]="supplier.name" />
      }
    </nz-select>
    @if (form.controls.supplierId.touched && form.controls.supplierId.invalid) {
      <small>Selecione um fornecedor cadastrado.</small>
    }
  </div>
  <label>
    <span>Preco unitario (R$)</span>
    <input nz-input type="number" formControlName="unitPrice" min="0" step="0.01" />
    @if (form.controls.unitPrice.touched && form.controls.unitPrice.invalid) {
      <small>Use um preco maior ou igual a zero.</small>
    }
  </label>
  <p class="form-hint">O preço total será calculado automaticamente pela quantidade do item.</p>
  @if (serverError()) {
    <p class="form-error" role="alert">{{ serverError() }}</p>
  }
  <div class="form-actions">
    <button nz-button type="button" [disabled]="submitting()" (click)="cancel()">Cancelar</button>
    <button nz-button nzType="primary" type="submit" [nzLoading]="submitting()">
      {{
        submitting() ? 'Salvando...' : mode() === 'create' ? 'Adicionar preço' : 'Salvar alteracoes'
      }}
    </button>
  </div>
</form>
