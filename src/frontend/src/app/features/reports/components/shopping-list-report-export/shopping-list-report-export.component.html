<div class="export-control" (keydown.escape)="closeExportMenu()">
  <button
    class="btn btn-outline-primary export-button"
    type="button"
    aria-haspopup="true"
    [attr.aria-controls]="optionsId"
    [attr.aria-label]="accessibleLabel()"
    [attr.aria-expanded]="exportMenuOpen()"
    [attr.aria-busy]="isDownloadingPdf() || isDownloadingExcel()"
    [disabled]="exportDisabled()"
    (click)="toggleExportMenu()"
  >
    <i class="bi bi-download" aria-hidden="true"></i>
    Exportar
    <i class="bi bi-chevron-down export-chevron" aria-hidden="true"></i>
  </button>

  @if (exportMenuOpen()) {
    <div [id]="optionsId" class="export-options" aria-label="Formatos de exportação">
      <button
        type="button"
        [disabled]="isDownloadingPdf()"
        (click)="downloadReport('pdf')"
      >
        @if (isDownloadingPdf()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          <span>Gerando PDF...</span>
        } @else {
          <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
          <span>Baixar PDF</span>
        }
      </button>
      <button
        type="button"
        [disabled]="isDownloadingExcel()"
        (click)="downloadReport('excel')"
      >
        @if (isDownloadingExcel()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          <span>Gerando Excel...</span>
        } @else {
          <i class="bi bi-file-earmark-spreadsheet" aria-hidden="true"></i>
          <span>Baixar Excel</span>
        }
      </button>
    </div>
  }

  @if (downloadError()) {
    <p class="export-message export-error" role="alert">
      <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
      {{ downloadError() }}
    </p>
  } @else if (downloadFeedback()) {
    <p class="export-message export-success" role="status" aria-live="polite">
      <i class="bi bi-check-circle" aria-hidden="true"></i>
      {{ downloadFeedback() }}
    </p>
  }
</div>
