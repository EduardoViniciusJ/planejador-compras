<div class="export-control" (keydown.escape)="closeExportMenu()">
  <button
    class="btn export-button"
    type="button"
    aria-haspopup="true"
    [attr.aria-controls]="optionsId"
    [attr.aria-label]="accessibleLabel()"
    [attr.aria-expanded]="exportMenuOpen()"
    [attr.aria-busy]="isDownloadingPdf() || isDownloadingExcel()"
    [disabled]="exportDisabled()"
    (click)="toggleExportMenu()"
  >
    <app-icon name="download" [size]="18" />
    Exportar
    <app-icon class="export-chevron" name="chevron-down" [size]="16" />
  </button>

  @if (exportMenuOpen()) {
    <div [id]="optionsId" class="export-options" aria-label="Formatos de exportação">
      <button type="button" [disabled]="isDownloadingPdf()" (click)="downloadReport('pdf')">
        @if (isDownloadingPdf()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          <span>Gerando PDF...</span>
        } @else {
          <app-icon name="file-type-pdf" [size]="20" />
          <span>Baixar PDF</span>
        }
      </button>
      <button type="button" [disabled]="isDownloadingExcel()" (click)="downloadReport('excel')">
        @if (isDownloadingExcel()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          <span>Gerando Excel...</span>
        } @else {
          <app-icon name="file-spreadsheet" [size]="20" />
          <span>Baixar Excel</span>
        }
      </button>
    </div>
  }

  @if (downloadError()) {
    <p class="export-message export-error" role="alert">
      <app-icon name="alert-triangle" [size]="18" />
      {{ downloadError() }}
    </p>
  } @else if (downloadFeedback()) {
    <p class="export-message export-success" role="status" aria-live="polite">
      <app-icon name="circle-check" [size]="18" />
      {{ downloadFeedback() }}
    </p>
  }
</div>
